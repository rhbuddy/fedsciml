# Appendix A.4 Performance Sweep (Optimizer Comparison)
sweep:
  problem: [poisson, antiderivative, schaffer]
  aggregator: [fedavg, fedprox, krum]
  optimizer: [adam]
  # krum requires K >= 2f+3, i.e. K >= 5 at the default f=n_byzantine=1. This
  # file previously used n_clients: 2, so every krum cell failed validation
  # while fedavg/fedprox ran - the sweep looked like it worked but a third of
  # it never executed. Keep n_clients >= 5 while krum is in the aggregator list.
  n_clients: 5
  heterogeneity:
    mode: 1d_partition
    n_pieces: 10
  seed: [42]
# This sweep expands to 3*3=9 configs; seeds expanded via separate runner handling
